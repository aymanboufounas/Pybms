[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybms"
version = "0.2.0"
description = "100 simple data and machine-learning workflows with a native NumPy neural learner"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ayman Boufounas"}]
dependencies = [
  "numpy>=1.24,<3", "pandas>=2.0,<4", "scikit-learn>=1.4,<2",
  "matplotlib>=3.9,<4", "joblib>=1.3,<2",
]
keywords = ["deep-learning", "machine-learning", "numpy", "education", "datasets", "automl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
io = ["openpyxl>=3.1", "pyarrow>=15"]
dev = ["pytest>=8", "build>=1.2", "twine>=5", "ruff>=0.9"]

[project.scripts]
pybms = "pybms.cli:main"

[project.urls]
Repository = "https://github.com/aymanboufounas/Pybms"
Documentation = "https://github.com/aymanboufounas/Pybms/tree/main/docs"
Issues = "https://github.com/aymanboufounas/Pybms/issues"

[tool.setuptools.packages.find]
include = ["pybms*"]

[tool.setuptools.package-data]
pybms = ["py.typed", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["docs/API_REFERENCE.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"pybms/__init__.py" = ["F401"]
