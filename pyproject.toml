[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybms"
version = "0.1.0"
description = "A beginner-first, forgiving deep-learning library built with NumPy"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Ayman Boufounas"}]
dependencies = ["numpy>=1.23"]
keywords = ["deep-learning", "neural-network", "machine-learning", "numpy", "education"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Repository = "https://github.com/aymanboufounas/Pybms"

[tool.setuptools.packages.find]
include = ["pybms*"]
