name: Tests and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,io]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python tools/generate_docs.py
      - run: git diff --exit-code -- docs/API_REFERENCE.md pybms/__init__.pyi
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python examples/tabular_quickstart.py
      - run: python examples/native_validation.py
      - run: python examples/gradient_descent.py
      - uses: actions/upload-artifact@v7
        with:
          name: pybms-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*

  minimum-dependencies:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m pip install "numpy==1.24.4" "pandas==2.0.3" "scikit-learn==1.4.2" "matplotlib==3.9.0" "joblib==1.3.2" "pytest>=8"
      - run: python -m pip install --no-deps .
      - run: python -m pytest -q
